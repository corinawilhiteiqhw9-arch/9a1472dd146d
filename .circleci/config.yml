      - run:
          name: Build executor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target notebookExec -j2
      - run:
          name: Execute notebook
          command: LIONSS_LP=1 ./build/notebookExec --in nb.ipynb --timeout 60
